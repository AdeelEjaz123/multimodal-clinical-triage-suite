  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scikit-learn>=1.3.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - pip:
      - transformers>=4.40.0
      - datasets>=2.18.0
      - accelerate>=0.29.0
      - trl>=0.8.6
      - peft>=0.10.0
      - bitsandbytes>=0.43.0
      - "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git"
