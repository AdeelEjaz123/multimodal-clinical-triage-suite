<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>

    <!-- Card Shadows & Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Header Gradients -->
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="tealHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="coralHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="navyHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #64748b; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #1e3a8a; }
    .code-text { font-family: "SF Mono", Monaco, Inconsolata, "Fira Code", monospace; font-size: 11px; fill: #e2e8f0; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="640" rx="16" fill="url(#bgGradient)" />

  <!-- Top Title Bar -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <text class="title" y="0">Multimodal Clinical Triage Suite (MCTS)</text>
    <text class="subtitle" y="24">End-to-End Emergency AI Pipeline: DenseNet-121 Vision &amp; Fine-Tuned Llama 3 8B Reasoner</text>
  </g>

  <!-- ==================== CARD 1: INPUTS ==================== -->
  <g transform="translate(48, 105)" filter="url(#cardShadow)">
    <rect width="240" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 226 0 C 233.732 0 240 6.268 240 14 L 240 46 L 0 46 Z" fill="url(#navyHeader)" />
    <text class="card-title" x="120" y="28" text-anchor="middle">1. Multimodal Inputs</text>

    <!-- Sub-box: X-Ray -->
    <rect x="18" y="62" width="204" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Chest X-Ray icon graphic -->
    <rect x="32" y="74" width="76" height="106" rx="6" fill="#0f172a" />
    <!-- Rib cage graphic -->
    <path d="M 50 94 Q 70 88 90 94 M 46 110 Q 70 102 94 110 M 44 126 Q 70 116 96 126 M 46 142 Q 70 132 94 142 M 70 85 L 70 160" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Spine glow -->
    <ellipse cx="70" cy="130" rx="10" ry="16" fill="#cbd5e1" opacity="0.3" />

    <text class="item-text" x="120" y="96" font-weight="700">Chest X-Ray</text>
    <text class="card-subtitle" x="120" y="116">224 × 224 RGB</text>
    <text class="card-subtitle" x="120" y="134">Frontal (AP / PA)</text>
    <rect x="118" y="146" width="94" height="20" rx="5" fill="#e2e8f0" />
    <text class="tag-text" x="165" y="160" text-anchor="middle" fill="#475569">CheXpert SOTA</text>

    <!-- Sub-box: Clinical Notes -->
    <rect x="18" y="206" width="204" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="30" y="220" width="28" height="34" rx="4" fill="#3b82f6" opacity="0.15" />
    <path d="M 38 230 L 50 230 M 38 236 L 50 236 M 38 242 L 46 242" stroke="#2563eb" stroke-width="2" stroke-linecap="round" />
    <text class="item-text" x="68" y="238" font-weight="700">EHR Clinical Notes</text>

    <text class="item-text" x="30" y="274">• Patient Age &amp; Gender</text>
    <text class="item-text" x="30" y="298">• Chief Complaint &amp; Vitals</text>
    <text class="item-text" x="30" y="322">• Physical Exam Findings</text>
    <text class="item-text" x="30" y="346">• 4-Day Symptom History</text>
    <text class="item-text" x="30" y="370">• Free-Text Unstructured</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(296, 230)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <polygon points="30,-6 40,0 30,6" fill="#3b82f6" />
    <text x="20" y="-12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563eb">Tensors</text>
  </g>

  <!-- ==================== CARD 2: VISION LAYER ==================== -->
  <g transform="translate(344, 105)" filter="url(#cardShadow)">
    <rect width="255" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 241 0 C 248.732 0 255 6.268 255 14 L 255 46 L 0 46 Z" fill="url(#blueHeader)" />
    <text class="card-title" x="127" y="28" text-anchor="middle">2. Vision Layer (DenseNet-121)</text>

    <rect x="18" y="62" width="219" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
    <text class="item-text" x="28" y="82" font-weight="700" fill="#1e40af">Dense Convolutional Backbone</text>
    <text class="card-subtitle" x="28" y="102">Feature reuse &amp; vanishing gradient relief</text>

    <!-- 14 Pathology Tags Grid -->
    <text class="item-text" x="18" y="142" font-weight="700">14 Radiological Pathologies:</text>
    
    <!-- Row 1 -->
    <rect x="18" y="154" width="104" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="70" y="170" text-anchor="middle">Cardiomegaly</text>
    <rect x="128" y="154" width="109" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="182" y="170" text-anchor="middle">Pulm. Edema</text>

    <!-- Row 2 -->
    <rect x="18" y="184" width="104" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="70" y="200" text-anchor="middle">Consolidation</text>
    <rect x="128" y="184" width="109" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="182" y="200" text-anchor="middle">Pneumothorax</text>

    <!-- Row 3 -->
    <rect x="18" y="214" width="104" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="70" y="230" text-anchor="middle">Pleural Effusion</text>
    <rect x="128" y="214" width="109" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="182" y="230" text-anchor="middle">Atelectasis</text>

    <!-- Row 4 -->
    <rect x="18" y="244" width="104" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="70" y="260" text-anchor="middle">Pneumonia</text>
    <rect x="128" y="244" width="109" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="182" y="260" text-anchor="middle">Lung Opacity</text>

    <!-- Row 5 -->
    <rect x="18" y="274" width="104" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="70" y="290" text-anchor="middle">Enlarged Heart</text>
    <rect x="128" y="274" width="109" height="24" rx="6" fill="#dbeafe" />
    <text class="tag-text" x="182" y="290" text-anchor="middle">+ 5 Other Labels</text>

    <!-- Threshold badge -->
    <rect x="18" y="314" width="219" height="78" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" />
    <text class="item-text" x="28" y="336" font-weight="700" fill="#15803d">SOTA F1-Score Thresholding</text>
    <text class="card-subtitle" x="28" y="356">Overcomes acute class imbalance</text>
    <text class="card-subtitle" x="28" y="376" font-weight="700" fill="#0f766e">Macro ROC-AUC: 0.889 (~89%)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(608, 230)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <polygon points="30,-6 40,0 30,6" fill="#0d9488" />
    <text x="20" y="-12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f766e">Detections</text>
  </g>

  <!-- Dotted Notes Bypass from 1 to 3 -->
  <path d="M 288 380 C 320 405, 620 405, 650 380" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5" />
  <rect x="420" y="396" width="125" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="482" y="410" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Clinical Notes Stream</text>

  <!-- ==================== CARD 3: REASONING LAYER ==================== -->
  <g transform="translate(656, 105)" filter="url(#cardShadow)">
    <rect width="255" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 241 0 C 248.732 0 255 6.268 255 14 L 255 46 L 0 46 Z" fill="url(#tealHeader)" />
    <text class="card-title" x="127" y="28" text-anchor="middle">3. Reasoning Layer (Llama 3 8B)</text>

    <!-- AI Core Graphic -->
    <rect x="18" y="62" width="219" height="74" rx="8" fill="#f0fdfa" stroke="#99f6e4" />
    <!-- Glowing AI neural icon -->
    <circle cx="50" cy="99" r="22" fill="#0d9488" opacity="0.15" />
    <circle cx="50" cy="99" r="14" fill="#0d9488" opacity="0.3" />
    <circle cx="50" cy="99" r="7" fill="#0d9488" />
    <line x1="38" y1="90" x2="62" y2="108" stroke="#0f766e" stroke-width="1.5" />
    <line x1="38" y1="108" x2="62" y2="90" stroke="#0f766e" stroke-width="1.5" />
    
    <text class="item-text" x="84" y="88" font-weight="700" fill="#115e59">Meta Llama 3 8B</text>
    <text class="card-subtitle" x="84" y="106">Unsloth 4-Bit QLoRA</text>
    <text class="card-subtitle" x="84" y="124">70% VRAM Reduction</text>

    <!-- PubMedQA Fine-Tuning Box -->
    <rect x="18" y="148" width="219" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text class="item-text" x="28" y="172" font-weight="700">Domain Adaptation:</text>
    <text class="item-text" x="28" y="194">• PubMedQA Biomedical Corpus</text>
    <text class="item-text" x="28" y="216">• CheXpert Pathology Matching</text>
    <text class="item-text" x="28" y="238">• Multi-Turn Triage Format</text>
    <text class="item-text" x="28" y="254" font-size="10.5" fill="#64748b">   (Rank=16, Alpha=16, 4-bit BNF)</text>

    <!-- Guardrail Box -->
    <rect x="18" y="274" width="219" height="118" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" />
    <text class="item-text" x="28" y="298" font-weight="700" fill="#b45309">Strict Evidence Grounding</text>
    <text class="item-text" x="28" y="320">• Zero Hallucination System Prompt</text>
    <text class="item-text" x="28" y="342">• Cross-Modal Verification</text>
    <text class="item-text" x="28" y="364">• Radiologist-Aligned Logic</text>
    <text class="item-text" x="28" y="382" font-size="10.5" fill="#78350f">   (Restricted to Explicit Findings)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(920, 230)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />
    <polygon points="30,-6 40,0 30,6" fill="#ea580c" />
    <text x="20" y="-12" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ea580c">Report</text>
  </g>

  <!-- ==================== CARD 4: TRIAGE REPORT ==================== -->
  <g transform="translate(968, 105)" filter="url(#cardShadow)">
    <rect width="184" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 170 0 C 177.732 0 184 6.268 184 14 L 184 46 L 0 46 Z" fill="url(#coralHeader)" />
    <text class="card-title" x="92" y="28" text-anchor="middle">4. Triage Decision</text>

    <!-- Structured Report Preview Box -->
    <rect x="14" y="62" width="156" height="330" rx="8" fill="#fffaf5" stroke="#fed7aa" stroke-width="1.2" />
    
    <text class="item-text" x="22" y="84" font-weight="700" fill="#9a3412">Clinical Triage Report</text>
    <line x1="22" y1="92" x2="158" y2="92" stroke="#fdba74" stroke-width="1" />

    <text class="item-text" x="22" y="112" font-size="11" font-weight="700" fill="#c2410c">Primary Diagnosis:</text>
    <text class="item-text" x="22" y="130" font-size="10.5" font-weight="600" fill="#0f172a">Acute Decompensated</text>
    <text class="item-text" x="22" y="146" font-size="10.5" font-weight="600" fill="#0f172a">Heart Failure (ADHF)</text>

    <text class="item-text" x="22" y="174" font-size="11" font-weight="700" fill="#c2410c">Evidence Synthesis:</text>
    <text class="card-subtitle" x="22" y="192" font-size="10">DenseNet visual Edema</text>
    <text class="card-subtitle" x="22" y="206" font-size="10">+ Cardiomegaly aligned</text>
    <text class="card-subtitle" x="22" y="220" font-size="10">with severe orthopnea</text>
    <text class="card-subtitle" x="22" y="234" font-size="10">&amp; leg swelling notes.</text>

    <text class="item-text" x="22" y="262" font-size="11" font-weight="700" fill="#c2410c">Triage Action:</text>
    <rect x="22" y="272" width="140" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5" />
    <text class="tag-text" x="92" y="289" text-anchor="middle" font-size="10" fill="#b91c1c">URGENT ADMIT (CCU)</text>

    <text class="item-text" x="22" y="322" font-size="10.5" font-weight="700">Immediate Orders:</text>
    <text class="card-subtitle" x="22" y="340" font-size="9.5">• IV Loop Diuretics</text>
    <text class="card-subtitle" x="22" y="356" font-size="9.5">• High-flow O₂ (SpO₂ &gt; 94%)</text>
    <text class="card-subtitle" x="22" y="372" font-size="9.5">• Urgent Echocardiogram</text>
  </g>

  <!-- ==================== BOTTOM BANNER: HARDWARE ORCHESTRATION ==================== -->
  <g transform="translate(48, 532)" filter="url(#cardShadow)">
    <rect width="1104" height="78" rx="12" fill="url(#purpleBar)" stroke="#4338ca" stroke-width="1.2" />
    
    <!-- Title & Icon -->
    <text class="card-title" x="32" y="32" fill="#e0e7ff" font-size="14">⚙️ Hardware &amp; GPU VRAM Orchestration Engine</text>
    <text class="subtitle" x="32" y="54" fill="#a5b4fc" font-size="11.5">Zero VRAM Deadlocks on a Single 15GB GPU / Multi-GPU T4 Configurations</text>

    <!-- Technical Badges -->
    <g transform="translate(560, 16)">
      <rect width="250" height="46" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text class="code-text" x="125" y="22" text-anchor="middle" font-size="10">PYTORCH_CUDA_ALLOC_CONF</text>
      <text class="code-text" x="125" y="38" text-anchor="middle" font-weight="700" fill="#38bdf8">expandable_segments:True</text>
    </g>

    <g transform="translate(830, 16)">
      <rect width="248" height="46" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text class="code-text" x="124" y="22" text-anchor="middle" font-size="10.5">Device Split / Sequential GC</text>
      <text class="code-text" x="124" y="38" text-anchor="middle" fill="#a7f3d0">cuda:0 (LLM) | cuda:1 (CNN)</text>
    </g>
  </g>
</svg>
